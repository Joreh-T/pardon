[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/platform", "crates/daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pardon-core = { path = "crates/core" }
pardon-platform = { path = "crates/platform" }
log = "0.4"
notify-rust = "4"
base64 = "0.22"
axum = "0.8"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "process", "signal"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-openai = "0.28"
eventsource-stream = "0.2"
futures = "0.3"
async-trait = "0.1"
toml = "0.8"
dirs = "5"
chrono = "0.4"
rodio = "0.20"
sha1 = "0.10"
wiremock = "0.6"
regex = "1"
anyhow = "1"
thiserror = "2"
interprocess = { version = "2.4", features = ["tokio"] }
