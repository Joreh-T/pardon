# 空表：gui 是独立 cargo 项目（own Cargo.lock）。上级 workspace 的
# members 不含 gui，缺此空表 cargo 会报 "believes it's in a workspace
# when it's not"。
[workspace]

[package]
name = "pardon-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
interprocess = { version = "2.4", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pardon-gui"
path = "src/main.rs"
